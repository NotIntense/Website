<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="Textures\favico.ico">
  <title>NotIntense | Developer Portfolio</title>

  <style>
    canvas {
      position: fixed;
      top: 0;
      left: 0;
    }

    #spotify-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(10, 10, 10, 0.8);
    padding: 10px;
    border-radius: 16px;
    z-index: 999;
    transition: transform 0.3s ease;
    }

    #spotify-container:hover {
    transform: scale(1.05);
    }

    #site-status {
    width: 100%;
    background: rgba(0, 255, 255, 0.1);
    color: #fff;
    text-align: center;
    padding: 8px 0;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    border-bottom: 1px solid rgba(0, 255, 255, 0.3);
    backdrop-filter: blur(8px);
    z-index: 1000;
    position: fixed;
    top: 0;
    left: 0;
    }
    body {
    padding-top: 36px; 
    }



  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <script type="module" src="main.js"></script>
  <div id="site-status"></div>
  <div id="spotify-container">
  <iframe 
  src="https://open.spotify.com/embed/playlist/2YzzQRodRYU0XtuRvcSTFO?utm_source=generator&theme=0" 
  width="340" height="152" frameborder="0" allowfullscreen
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
  loading="lazy"
  style="border: none; border-radius: 12px;">
</iframe>

</div>

</body>
</html>
