<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>NotIntense | Portfolio</title>
    <script type="module" src="/main.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet"> 

	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
      body { margin: 0; }

	  .font-exo {
		font-family: 'Big Shoulders', sans-serif;
	  }

	  .ibm-plex-mono-regular {
  		font-family: "IBM Plex Mono", monospace;
  		font-weight: 400;
  		font-style: normal;
	  }		
    </style>
  </head>
  <body class="flex justify-center items-center">
    <div id="app" class="absolute text-center text-white" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
      <h1 class="ibm-plex-mono-regular text-4xl tracking-wide">NotIntense</h1>
      <p class="font-exo text-5xl">Self-Taught Game Developer</p>
	  <div class="space-x-7 space-y-3">
        <a 
		 href="https://threejs.org/docs/#manual/en/introduction/Installation"
			class="border px-2 py-1 ibm-plex-mono-regular hover:bg-white hover:text-gray-800 inline-block">View projects ➔</a>
        <a 
		 href="https://threejs.org/docs/#manual/en/introduction/Installation"
			class="border px-2 py-1 ibm-plex-mono-regular hover:bg-white hover:text-gray-800 inline-block">Autobiography ➔</a>
			
      </div>
    </div>
	<div class="absolute text-center text-white" style="top: 95%; left: 98%; transform: translate(-50%, -50%);">
		<button id="volumeMuteButton" onclick="onButtonClicked()">
		  <i id="volumeIcon" class="fa-solid fa-volume-xmark"></i>
		</button>
	  </div>	  
  </body>

  <script>

	function onButtonClicked() {
	  const buttonIcon = document.getElementById('volumeIcon');
  
	  if (buttonIcon.classList.contains('fa-volume-xmark')) {
		buttonIcon.classList.remove('fa-volume-xmark');
		buttonIcon.classList.add('fa-volume-high');
		
	  } else {
		buttonIcon.classList.remove('fa-volume-high');
		buttonIcon.classList.add('fa-volume-xmark');
	  }
	}
  </script>
</html>
