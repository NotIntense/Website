<!DOCTYPE html>
<html>
<head>
  <title>Page Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;  
      justify-content: center;
      align-items: center;
      background-color: #000; 
      color: #fff;             
      font-family: sans-serif;
      text-align: center;
    }

    img {
      max-width: 80vw;
      max-height: 80vh;
      pointer-events: none;     
      opacity: 0;             
      animation: fadeIn 2s ease forwards; 
    }

    a {
    color: #ffd85e;     
    text-decoration: none;
    }

    a:hover {
    text-decoration: underline;
    opacity: 0.8;
    }

    a:visited {
    color: #ffd85e;
    }


    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
    <div id="text">
        This world is dead, maybe 
        <a href="/">the next one</a>.
    </div>
  <img src="textures/Unlit_sun.webp">
</body>
</html>
