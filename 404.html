<!DOCTYPE html>
<html>
<head>
  <title>Page Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;  
      justify-content: center;
      align-items: center;
      background-color: #000; 
      color: #fff;             
      font-family: sans-serif;
      text-align: center;
    }

    img {
      max-width: 80vw;
      max-height: 80vh;
      pointer-events: none;     
      opacity: 0;             
      animation: fadeIn 2s ease forwards; 
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="text">Page Not Found</div>

  <img src="textures/Unlit_sun.webp">
</body>
</html>
