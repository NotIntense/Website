<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NotIntense | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; }
    .font-exo { font-family: "Jersey 25", sans-serif; }
    .ibm-plex-mono-regular { font-family: "IBM Plex Mono", monospace; font-weight: 400; }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-black text-white">
  <canvas id="bgCanvas" class="absolute top-0 left-0 w-full h-full z-0"></canvas>

  <div class="relative z-10 p-8 bg-gray-900 bg-opacity-90 rounded-xl shadow-lg max-w-xl text-center">
    <img src="Textures\image.jpg" alt="Profile Picture" class="w-32 h-32 mx-auto rounded-full border-4 border-white mb-4">
    <h1 class="ibm-plex-mono-regular text-3xl">NotIntense</h1>
    <p class="font-exo text-xl mt-2">Self-Taught Software Developer</p>
    <p class="mt-4 text-lg text-gray-300">
      Working on code since 2020 with C#, C++ and JavaScript.<br>
      Game & Software Developer.<br>
      Developer for 
      <strong><a href="https://store.steampowered.com/app/1402020/SCP_Labrat/" class="text-blue-400 hover:underline" target="_blank">SCP: Labrat</a></strong> 
      and 
      <strong><a href="https://store.steampowered.com/app/2707670/SCP_Valravn/" class="text-blue-400 hover:underline" target="_blank">SCP: Valravn</a></strong>.
    </p>    
    

    <blockquote class="italic text-gray-400 mt-6">
      “Do not go gentle into that good night.” — Dylan Thomas
    </blockquote>

    <div class="flex justify-center space-x-6 mt-6 text-2xl">
      <a href="https://github.com/NotIntense" target="_blank" class="hover:text-gray-400"><i class="fab fa-github"></i></a>
      <a href="mailto:contact@notintense.com" class="hover:text-gray-400"><i class="fas fa-envelope"></i></a>
    </div>

    <button id="toggleMusic" class="mt-6 text-sm px-4 py-2 border border-white rounded hover:bg-white hover:text-black transition">
      ▸ Show Music
    </button>

    <div id="musicSection" class="mt-6 hidden">
      <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/4vSlIeLQxLnmSMGO8VggwM?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js";
    import { createStarfield } from '/Code/Stars.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bgCanvas'), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const animate = createStarfield(scene, renderer, camera);
    renderer.setAnimationLoop(animate);

    document.getElementById('toggleMusic').addEventListener('click', () => {
      const section = document.getElementById('musicSection');
      const button = document.getElementById('toggleMusic');
      if (section.classList.contains('hidden')) {
        section.classList.remove('hidden');
        button.textContent = '▾ Hide Music';
      } else {
        section.classList.add('hidden');
        button.textContent = '▸ Show Music';
      }
    });
  </script>
</body>
</html>
